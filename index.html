<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TACTIC BOARD</title>
<style>
:root{--bg:#102018;--panel:#f6f1df;--ink:#17231c;--green:#174f32;--green2:#206b43;--line:#e8e0c9;--red:#d94b4b;--white:#fff;--gold:#e5b84d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow-x:hidden}
button,select,input{font:inherit}
button{border:0;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{height:64px;background:#0c1711;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0005}
.logo{font-weight:900;letter-spacing:.08em;font-size:18px}
.header-actions{margin-left:auto;display:flex;gap:8px}
.btn{padding:10px 13px;border-radius:10px;background:#fff;color:#17301f;font-weight:700}
.btn.primary{background:var(--gold)}
.btn.dark{background:#20362a;color:#fff}
.main{display:grid;grid-template-columns:minmax(0,560px) 320px;gap:18px;padding:18px;max-width:920px;width:100%;margin:0 auto;align-items:start}
.stage{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.board-wrap{width:100%;box-sizing:border-box;background:#07110b;border-radius:18px;padding:10px;box-shadow:0 8px 30px #0005;margin:0 auto}
#board{display:block;width:100%;height:auto;max-height:none;aspect-ratio:720/1100;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;background:#1b5b39}
.modebar{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff}
.badge{background:#20382b;padding:7px 10px;border-radius:999px;font-size:13px}
.side{width:100%;box-sizing:border-box;background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto}
.section{border-top:1px solid #d8d0ba;padding-top:12px}
.section:first-child{border-top:0;padding-top:0}
.section h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tool{background:#fff;border:1px solid #ddd4bd;border-radius:9px;padding:9px;text-align:center}
.tool.active{outline:3px solid #d9b653}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row>*{flex:1}
input,select{width:100%;padding:9px;border:1px solid #ccc3aa;border-radius:9px;background:#fff}
.small{font-size:12px;color:#657065}
.saved{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #ddd4bd;border-radius:9px;padding:7px}
.saved span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger{color:#a92323}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101914;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1}
.quick-tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.quick{
  min-height:54px;
  border-radius:14px;
  border:1px solid #d5ccb3;
  background:#fff;
  color:#17301f;
  font-weight:800;
  font-size:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  touch-action:manipulation;
}
.quick span{font-size:11px;font-weight:700}
.quick.active{background:#17301f;color:#fff;outline:3px solid #d9b653}

.view-tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.view-btn{
  padding:10px 5px;
  border-radius:11px;
  border:1px solid #d5ccb3;
  background:#fff;
  font-weight:800;
  color:#243126;
}
.view-btn.active{background:#e8d79d;border-color:#c4a64e}

.pen-panel{
  background:#ece5d0;
  border-radius:12px;
  padding:10px;
}
.mini-title{font-size:12px;font-weight:800;margin-bottom:7px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.wide{width:100%;margin-top:7px}
.advanced{
  border-top:1px solid #d8d0ba;
  padding-top:10px;
}
.advanced summary{
  cursor:pointer;
  font-weight:900;
  padding:9px 2px;
  user-select:none;
}
.advanced[open] summary{margin-bottom:4px}
.section + .section{margin-top:10px}


/* PC・タブレット最適化 */
.quick{cursor:pointer;min-height:58px}
.view-btn{cursor:pointer;padding:11px 8px}
.tool,.btn,select,input{min-height:40px}
.tool,.btn{cursor:pointer}
.section h3{margin-bottom:7px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 auto;min-width:0}

@media (min-width:1200px){
  .main{max-width:980px;grid-template-columns:620px 330px;gap:20px}
}

@media (min-width:700px) and (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr);max-width:650px;padding:14px}
  .side{position:static;max-height:none}
}

@media (min-width:900px) and (max-height:850px){
  .board-wrap{max-height:calc(100vh - 150px);overflow:hidden}
  #board{max-height:calc(100vh - 170px);width:auto;max-width:100%;margin:0 auto}
}

.corner-tools{background:#ece5d0;border-radius:12px;padding:10px}
.corner-title{font-size:12px;font-weight:900;margin-bottom:7px}
.corner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.corner-btn,.zoom-btn{min-height:40px;border:1px solid #cfc5aa;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}
.corner-btn.active{background:#1b5b39;color:#fff;border-color:#1b5b39}
.zoom-row{display:grid;grid-template-columns:48px 1fr 48px 82px;gap:7px;margin-top:8px;align-items:center}
.zoom-label{text-align:center;font-weight:900}
.zoom-btn{font-size:20px}
.zoom-btn.reset{font-size:12px}
@media (min-width:900px){
  .corner-tools{grid-column:1/-1}
}

.corner-canvas{
  aspect-ratio:720/550 !important;
}

.third-tools{
  background:#ece5d0;
  border-radius:12px;
  padding:10px;
}
.third-title{
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
}
.third-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:6px;
}
.third-btn{
  min-height:44px;
  border:1px solid #cfc5aa;
  background:#fff;
  color:#243126;
  border-radius:9px;
  font-size:12px;
  font-weight:900;
  line-height:1.15;
  cursor:pointer;
}
.third-btn.active{
  background:#1b5b39;
  color:#fff;
  border-color:#1b5b39;
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">⚽ TACTIC BOARD</div>
  <div class="header-actions">
    <button class="btn dark hide-mobile" id="undoBtn">↶ 戻す</button>
    <button class="btn primary" id="shareBtn">画像で共有</button>
  </div>
</header>

<main class="main">
<section class="stage">
  <div class="modebar">
    <span class="badge" id="modeBadge">移動モード</span>
    <span class="badge" id="viewBadge">全体</span>
    <span class="badge" id="animBadge">コマ 0</span>
  </div>
  <div class="board-wrap"><canvas id="board" width="720" height="1100"></canvas></div>
</section>

<aside class="side">
  <div class="quick-tools">
    <button class="quick active" id="moveTool">↔<span>選手</span></button>
    <button class="quick" id="penTool">✎<span>線</span></button>
    <button class="quick" id="undo2Btn">↶<span>戻す</span></button>
    <button class="quick" id="clearBtn">⌫<span>消す</span></button>
  </div>

  <div class="view-tools">
    <button class="view-btn active" data-view="full">全体</button>
    <button class="view-btn" data-view="attack">攻撃</button>
    <button class="view-btn" data-view="defense">守備</button>
    <button class="view-btn" data-view="goal">ゴール前</button>
    <button class="view-btn" data-view="corner">CK拡大</button>
  </div>

  <div class="third-tools">
    <div class="third-title">ピッチの3分割</div>
    <div class="third-grid">
      <button class="third-btn active" data-third="all">全体</button>
      <button class="third-btn" data-third="attacking">アタッキング<br>サード</button>
      <button class="third-btn" data-third="middle">ミドル<br>サード</button>
      <button class="third-btn" data-third="defending">ディフェンディング<br>サード</button>
    </div>
  </div>

  <div id="cornerTools" class="corner-tools" style="display:none">
    <div class="corner-title">CKエリア — コーナーからハーフラインまで</div>
    <div class="corner-grid">
      <button class="corner-btn active" data-corner="TL">↖ 左上</button>
      <button class="corner-btn" data-corner="TR">↗ 右上</button>
      <button class="corner-btn" data-corner="BL">↙ 左下</button>
      <button class="corner-btn" data-corner="BR">↘ 右下</button>
    </div>
    <div class="zoom-row">
      <button class="zoom-btn" id="zoomOut">小</button>
      <div class="zoom-label" id="zoomLabel">半面表示</div>
      <button class="zoom-btn" id="zoomIn">大</button>
      <button class="zoom-btn reset" id="zoomReset">リセット</button>
    </div>
  </div>

  <div id="penOptions" class="pen-panel" style="display:none">
    <div class="mini-title">線の設定</div>
    <div class="grid3">
      <button class="tool active" data-color="#d94b4b">赤</button>
      <button class="tool" data-color="#3d78d8">青</button>
      <button class="tool" data-color="#e5b84d">黄</button>
    </div>
    <div class="grid2" style="margin-top:7px">
      <button class="tool active" data-dash="0">実線</button>
      <button class="tool" data-dash="1">点線</button>
    </div>
  </div>

  <details class="advanced">
    <summary>⚙ 詳細設定</summary>

    <section class="section">
      <h3>フォーメーション</h3>
      <select id="formation">
        <option value="4-4-2">4-4-2</option>
        <option value="4-3-3">4-3-3</option>
        <option value="4-2-3-1">4-2-3-1</option>
        <option value="3-5-2">3-5-2</option>
        <option value="4-5-1">4-5-1</option>
      </select>
      <button class="tool wide" id="applyFormation">両チームに配置</button>
    </section>

    <section class="section">
      <h3>アニメーション</h3>
      <div class="row">
        <button class="tool" id="addFrame">＋ コマ追加</button>
        <button class="tool" id="play">▶ 再生</button>
        <button class="tool" id="clearFrames">コマ消去</button>
      </div>
      <p class="small">選手を動かして「コマ追加」を押すと、動きを記録できます。</p>
    </section>

    <section class="section">
      <h3>作戦を保存</h3>
      <div class="row">
        <input id="tacticName" placeholder="例：CK パターンA">
        <button class="tool" id="saveBtn">保存</button>
      </div>
      <div id="savedList" style="margin-top:7px"></div>
    </section>
  </details>
</aside>
</main>
</div>
<div id="toast"></div>

<script>
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
const W=720,H=1100;
let view="full", corner="TL", zoom=1, third="all", mode="move", penColor="#d94b4b", dashed=false;
let activeTeam="red", selected=null, drawing=false, currentStroke=[];
let lines=[], frames=[], playing=false, playTimer=null;
let players=[], ball={id:"ball",x:360,y:520,r:14};

const formations={
"4-4-2":[[360,1010],[160,900],[285,920],[435,920],[560,900],[150,700],[285,730],[435,730],[570,700],[285,520],[435,520]],
"4-3-3":[[360,1010],[160,900],[285,920],[435,920],[560,900],[190,730],[360,700],[530,730],[180,500],[360,450],[540,500]],
"4-2-3-1":[[360,1010],[160,900],[285,920],[435,920],[560,900],[250,750],[470,750],[180,590],[360,560],[540,590],[360,410]],
"3-5-2":[[360,1010],[220,900],[360,920],[500,900],[150,720],[260,700],[360,680],[460,700],[570,720],[290,500],[430,500]],
"4-5-1":[[360,1010],[160,900],[285,920],[435,920],[560,900],[130,720],[245,700],[360,680],[475,700],[590,720],[360,470]]
};

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function makePlayers(){
  players=[];
  const f=formations[document.getElementById("formation").value];
  f.forEach((p,i)=>players.push({id:"R"+(i+1),team:"red",x:p[0],y:p[1],r:22}));
  f.forEach((p,i)=>players.push({id:"W"+(i+1),team:"white",x:W-p[0],y:H-p[1],r:22}));
  selected=null; frames=[]; lines=[]; updateAnim();
}
function resizeCanvasForView(){
  const compact = view==="corner";
  const thirdZoom = third!=="all" && view!=="corner";
  const targetH = compact ? Math.round(H/2) : thirdZoom ? Math.round(H/1.85) : H;
  if(canvas.height!==targetH || canvas.width!==W){
    canvas.width=W;
    canvas.height=targetH;
  }
  canvas.classList.toggle("corner-canvas",compact || thirdZoom);
}
function getCamera(){
  if(view==="corner"){
    const overlap=30;
    return {
      x:0,
      y:(corner==="TL"||corner==="TR")?0:H/2-overlap,
      w:W,
      h:H/2+overlap*2
    };
  }
  if(third!=="all"){
    const thirdH=H/3;
    const index={attacking:0,middle:1,defending:2}[third];
    const overlap=28;

    // Crop a little from the sides as well as the top/bottom.
    // This makes the selected third noticeably larger on screen.
    const camW=600;
    const camX=(W-camW)/2;
    const top=Math.max(0,index*thirdH-overlap);
    const bottom=Math.min(H,index*thirdH+thirdH+overlap);

    return {
      x:camX,
      y:top,
      w:camW,
      h:bottom-top
    };
  }
  return {x:0,y:0,w:W,h:H};
}
function getTransform(){
  const cam=getCamera();
  const vw=canvas.width, vh=canvas.height;
  const scale=Math.min(vw/cam.w,vh/cam.h);
  const drawW=cam.w*scale, drawH=cam.h*scale;
  const ox=(vw-drawW)/2, oy=(vh-drawH)/2;
  return {cam,scale,ox,oy,vw,vh};
}
function worldToScreen(x,y){
  const t=getTransform();
  return {x:(x-t.cam.x)*t.scale+t.ox,y:(y-t.cam.y)*t.scale+t.oy};
}
function screenToWorld(x,y){
  const t=getTransform();
  return {x:(x-t.ox)/t.scale+t.cam.x,y:(y-t.oy)/t.scale+t.cam.y};
}
function drawPitch(){
  ctx.fillStyle="#07110b";ctx.fillRect(0,0,canvas.width,canvas.height);
  const t=getTransform();
  ctx.save();
  ctx.translate(t.ox,t.oy);
  ctx.scale(t.scale,t.scale);
  ctx.translate(-t.cam.x,-t.cam.y);

  ctx.fillStyle="#1b5b39";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#d9e6c7";ctx.lineWidth=3/t.scale;
  ctx.strokeRect(22,22,W-44,H-44);

  ctx.beginPath();ctx.moveTo(22,H/2);ctx.lineTo(W-22,H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,105,0,Math.PI*2);ctx.stroke();

  ctx.strokeRect(135,22,450,180);
  ctx.strokeRect(135,H-202,450,180);
  ctx.strokeRect(245,22,230,70);
  ctx.strokeRect(245,H-92,230,70);

  ctx.fillStyle="#fff";
  ctx.fillRect(315,5,90,17);
  ctx.fillRect(315,H-22,90,17);

  ctx.restore();

}
function drawLine(line){
  if(line.pts.length<2)return;
  const pts=line.pts.map(p=>worldToScreen(p.x,p.y));
  ctx.save();
  ctx.strokeStyle=line.color;ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.setLineDash(line.dash?[15,12]:[]);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();ctx.setLineDash([]);

  const a=pts.at(-2),b=pts.at(-1),ang=Math.atan2(b.y-a.y,b.x-a.x),s=20;
  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x-s*Math.cos(ang-.5),b.y-s*Math.sin(ang-.5));
  ctx.lineTo(b.x-s*Math.cos(ang+.5),b.y-s*Math.sin(ang+.5));
  ctx.closePath();ctx.fillStyle=line.color;ctx.fill();
  ctx.restore();
}
function drawPlayer(p){
  const s=worldToScreen(p.x,p.y);
  const t=getTransform();
  const visualBoost=(third!=="all" && view!=="corner") ? 1.12 : 1;
  const r=p.r*t.scale*visualBoost;
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=p.team==="red"?"#d94b4b":"#fff";ctx.fill();
  ctx.lineWidth=Math.max(2,3*t.scale);
  ctx.strokeStyle=p.team==="red"?"#7e2020":"#344039";ctx.stroke();
  ctx.fillStyle=p.team==="red"?"#fff":"#17231c";
  ctx.font=`bold ${Math.max(11,14*t.scale)}px system-ui`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(p.id.slice(1),0,0);

  if(selected===p.id){
    ctx.beginPath();ctx.arc(0,0,(p.r+7)*t.scale,0,Math.PI*2);
    ctx.strokeStyle="#e5b84d";ctx.lineWidth=Math.max(3,4*t.scale);ctx.stroke();
  }
  ctx.restore();
}
function drawBall(){
  const s=worldToScreen(ball.x,ball.y),t=getTransform();
  const r=Math.max(9,ball.r*t.scale);

  ctx.save();
  ctx.translate(s.x,s.y);

  // Outer shadow / border
  ctx.beginPath();
  ctx.arc(0,0,r+2,0,Math.PI*2);
  ctx.fillStyle="#0b0f0c";
  ctx.fill();

  // Main ball
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle="#ffffff";
  ctx.fill();
  ctx.strokeStyle="#111814";
  ctx.lineWidth=2;
  ctx.stroke();

  // Simple black pattern so the ball cannot be confused with a player.
  const rr=r*.24;
  ctx.beginPath();
  ctx.moveTo(0,-rr);
  ctx.lineTo(rr*.95,-rr*.3);
  ctx.lineTo(rr*.6,rr*.8);
  ctx.lineTo(-rr*.6,rr*.8);
  ctx.lineTo(-rr*.95,-rr*.3);
  ctx.closePath();
  ctx.fillStyle="#17231c";
  ctx.fill();

  // Small selection ring
  if(selected==="ball"){
    ctx.beginPath();
    ctx.arc(0,0,r+8,0,Math.PI*2);
    ctx.strokeStyle="#e5b84d";
    ctx.lineWidth=4;
    ctx.stroke();
  }

  ctx.restore();
}
function drawThirds(){
  if(third==="all") return;

  const y1=H/3, y2=H*2/3;
  ctx.save();
  ctx.fillStyle="#f5d67a18";
  ctx.strokeStyle="#f5d67a55";
  ctx.lineWidth=3;

  if(third==="defending"){
    ctx.fillRect(0,0,W,y1);
    ctx.strokeRect(0,0,W,y1);
  }else if(third==="middle"){
    ctx.fillRect(0,y1,W,y2-y1);
    ctx.strokeRect(0,y1,W,y2-y1);
  }else if(third==="attacking"){
    ctx.fillRect(0,y2,W,H-y2);
    ctx.strokeRect(0,y2,W,H-y2);
  }

  // Clear, subtle third lines.
  ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(W,y1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(W,y2);ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 18px system-ui";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  const labels={
    defending:"DEFENDING THIRD",
    middle:"MIDDLE THIRD",
    attacking:"ATTACKING THIRD"
  };
  const cy=third==="defending"?y1/2:third==="middle"?(y1+y2)/2:(y2+H)/2;
  ctx.fillText(labels[third],W/2,cy);
  ctx.restore();
}


function drawThirdZoomLabel(){
  if(third==="all" || view==="corner") return;
  const label={
    defending:"ディフェンディングサード",
    middle:"ミドルサード",
    attacking:"アタッキングサード"
  }[third];
  ctx.save();
  ctx.fillStyle="#07110bd9";
  ctx.fillRect(16,16,285,40);
  ctx.fillStyle="#fff";
  ctx.font="bold 17px system-ui";
  ctx.textAlign="left";
  ctx.textBaseline="middle";
  ctx.fillText("拡大："+label,28,36);
  ctx.restore();
}

function render(){
  drawPitch();if(view!=="corner" && third==="all")drawThirds();lines.forEach(drawLine);players.forEach(drawPlayer);drawBall();drawThirdZoomLabel();
  if(drawing&&currentStroke.length>1)drawLine({pts:currentStroke,color:penColor,dash:dashed});
  document.getElementById("zoomLabel").textContent=view==="corner"?"半面表示":(zoom).toFixed(1)+"×";
}
function pos(e){
  const r=canvas.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  return screenToWorld(sx/r.width*W,sy/r.height*H);
}
function hit(p){
  // Larger touch/click targets when a third is enlarged.
  const extra = third!=="all" && view!=="corner" ? 24 : 12;

  for(let i=players.length-1;i>=0;i--){
    const q=players[i];
    const dx=q.x-p.x,dy=q.y-p.y;
    if(Math.hypot(dx,dy)<q.r+extra)return q;
  }

  const dx=ball.x-p.x,dy=ball.y-p.y;
  const ballExtra = third!=="all" && view!=="corner" ? 30 : 24;
  if(Math.hypot(dx,dy)<ball.r+ballExtra){
    return {id:"ball",x:ball.x,y:ball.y,r:ball.r,kind:"ball"};
  }
  return null;
}
function pointerDown(e){
  e.preventDefault();
  if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  const p=pos(e);
  if(mode==="pen"){
    drawing=true;currentStroke=[p];render();return;
  }
  const h=hit(p);
  selected=h?h.id:null;
  render();
}
function pointerMove(e){
  if(!drawing&&selected===null)return;
  const p=pos(e);
  if(mode==="pen"){if(drawing){currentStroke.push(p);render()}}
  else{
    const o=selected==="ball"?ball:players.find(x=>x.id===selected);
    if(o){o.x=Math.max(25,Math.min(W-25,p.x));o.y=Math.max(25,Math.min(H-25,p.y));render()}
  }
}
function pointerUp(e){
  if(canvas.releasePointerCapture){
    try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  }
  if(mode==="pen"&&drawing){
    if(currentStroke.length>1)lines.push({pts:currentStroke,color:penColor,dash:dashed});
    currentStroke=[];drawing=false;render();
  }
  selected=null;
}

canvas.addEventListener("wheel",e=>{
  if(view!=="corner")return;
  e.preventDefault();
  setZoom(zoom+(e.deltaY<0?0.2:-0.2));
},{passive:false});
canvas.addEventListener("pointerdown",pointerDown);canvas.addEventListener("pointermove",pointerMove);canvas.addEventListener("pointerup",pointerUp);canvas.addEventListener("pointercancel",pointerUp);
function setMode(m){mode=m;document.getElementById("moveTool").classList.toggle("active",m==="move");document.getElementById("penTool").classList.toggle("active",m==="pen");document.getElementById("penOptions").style.display=m==="pen"?"block":"none";document.getElementById("modeBadge").textContent=m==="pen"?"線を描くモード":"移動モード";selected=null;render()}
function updateAnim(){document.getElementById("animBadge").textContent="コマ "+frames.length}
function snapshot(){return JSON.parse(JSON.stringify({players,ball}))}
function applySnap(s){players=JSON.parse(JSON.stringify(s.players));ball=JSON.parse(JSON.stringify(s.ball));render()}
function animateFrames(){
  if(playing||frames.length<2)return;
  playing=true;let i=0,t=0,dur=550;
  function step(now){
    if(!playing)return;
    if(!t)t=now;let q=Math.min(1,(now-t)/dur),a=frames[i],b=frames[(i+1)%frames.length];
    players.forEach((p,k)=>{p.x=a.players[k].x+(b.players[k].x-a.players[k].x)*q;p.y=a.players[k].y+(b.players[k].y-a.players[k].y)*q});
    ball.x=a.ball.x+(b.ball.x-a.ball.x)*q;ball.y=a.ball.y+(b.ball.y-a.ball.y)*q;render();
    if(q>=1){i=(i+1)%frames.length;t=now}
    requestAnimationFrame(step)
  }requestAnimationFrame(step)
}
function stopAnim(){playing=false}
function applyFormation(){
  stopAnim();makePlayers();render();toast("フォーメーションを配置しました")
}
function save(){
  const name=document.getElementById("tacticName").value.trim()||"無題の作戦";
  const data={name,view,corner,zoom,third,players,ball,lines,frames,formation:document.getElementById("formation").value,date:new Date().toLocaleString("ja-JP")};
  const list=JSON.parse(localStorage.getItem("tactics-v2")||"[]");list.unshift(data);localStorage.setItem("tactics-v2",JSON.stringify(list.slice(0,30)));renderSaved();toast("作戦を保存しました")
}
function load(i){stopAnim();const d=JSON.parse(localStorage.getItem("tactics-v2"))[i];view=d.view||"full";corner=d.corner||"TL";zoom=d.zoom||1;third=d.third||"all";players=d.players;ball=d.ball||{id:"ball",x:360,y:520,r:14};ball.id="ball";lines=d.lines||[];frames=d.frames||[];document.getElementById("formation").value=d.formation||"4-4-2";updateViewUI();updateAnim();render();toast("作戦を読み込みました")}
function del(i){const l=JSON.parse(localStorage.getItem("tactics-v2")||"[]");l.splice(i,1);localStorage.setItem("tactics-v2",JSON.stringify(l));renderSaved()}
function renderSaved(){const e=document.getElementById("savedList"),l=JSON.parse(localStorage.getItem("tactics-v2")||"[]");e.innerHTML=l.length?l.map((x,i)=>`<div class="saved"><span>${escapeHtml(x.name)}</span><button onclick="load(${i})">開く</button><button class="danger" onclick="del(${i})">×</button></div>`).join(""):`<div class="small">保存した作戦はここに表示されます。</div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function placeBallAtCorner(){
  const margin = 22;
  const positions = {
    TL:{x:margin,y:margin},
    TR:{x:W-margin,y:margin},
    BL:{x:margin,y:H-margin},
    BR:{x:W-margin,y:H-margin}
  };
  const p = positions[corner] || positions.TL;
  ball.x = p.x;
  ball.y = p.y;
}

function updateViewUI(){
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 const labels={full:"全体",attack:"攻撃側",defense:"守備側",goal:"ゴール前",corner:"CK拡大"};
 document.getElementById("viewBadge").textContent=labels[view];
 document.getElementById("cornerTools").style.display=view==="corner"?"block":"none";
 resizeCanvasForView();
 render();
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  if(view==="corner"){
    if(!corner) corner="TL";
    placeBallAtCorner();
  }
  updateViewUI();
});
document.querySelectorAll("[data-third]").forEach(b=>b.onclick=()=>{
  third=b.dataset.third;
  document.querySelectorAll("[data-third]").forEach(x=>x.classList.toggle("active",x.dataset.third===third));
  if(view==="corner") view="full";
  resizeCanvasForView();
  render();
});

document.querySelectorAll("[data-corner]").forEach(b=>b.onclick=()=>{
  corner=b.dataset.corner;
  document.querySelectorAll("[data-corner]").forEach(x=>x.classList.toggle("active",x.dataset.corner===corner));
  view="corner";
  placeBallAtCorner();
  updateViewUI();
});
function setZoom(z){
  zoom=Math.max(1,Math.min(1.15,z));
  if(view==="corner"){
    // Whole half-line remains visible; "大" uses a slightly taller viewing area.
    const h=zoom>1?Math.round(H/2+70):H/2;
    canvas.height=h;
    canvas.classList.toggle("corner-canvas",true);
  }
  render();
}
document.getElementById("zoomIn").onclick=()=>setZoom(zoom+0.2);
document.getElementById("zoomOut").onclick=()=>setZoom(zoom-0.2);
document.getElementById("zoomReset").onclick=()=>setZoom(1);

document.getElementById("moveTool").onclick=()=>setMode("move");
document.getElementById("penTool").onclick=()=>setMode("pen");
document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{penColor=b.dataset.color;document.querySelectorAll("[data-color]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
document.querySelectorAll("[data-dash]").forEach(b=>b.onclick=()=>{dashed=b.dataset.dash==="1";document.querySelectorAll("[data-dash]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
function undo(){if(lines.length){lines.pop();render();toast("1つ戻しました")}}
document.getElementById("undoBtn").onclick=undo;document.getElementById("undo2Btn").onclick=undo;
document.getElementById("clearBtn").onclick=()=>{lines=[];render();toast("線を消しました")};
document.getElementById("applyFormation").onclick=applyFormation;
document.getElementById("addFrame").onclick=()=>{stopAnim();frames.push(snapshot());updateAnim();toast("コマを追加しました")};
document.getElementById("play").onclick=()=>{if(playing)stopAnim();else animateFrames()};
document.getElementById("clearFrames").onclick=()=>{stopAnim();frames=[];updateAnim();toast("コマを消しました")};
document.getElementById("saveBtn").onclick=save;
document.getElementById("shareBtn").onclick=async()=>{
  const old=selected;selected=null;render();
  const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
  const file=new File([blob],"tactic-board.png",{type:"image/png"});
  if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:"TACTIC BOARD",files:[file]})}catch{}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tactic-board.png";a.click();URL.revokeObjectURL(a.href);toast("画像を保存しました")}
  selected=old;render();
};
makePlayers();if(view==="corner")placeBallAtCorner();resizeCanvasForView();render();renderSaved();

document.addEventListener("keydown",e=>{
  if(e.key==="0"){third="all";document.querySelectorAll("[data-third]").forEach(x=>x.classList.toggle("active",x.dataset.third==="all"));resizeCanvasForView();render();}
});
</script>
</body>
</html>
